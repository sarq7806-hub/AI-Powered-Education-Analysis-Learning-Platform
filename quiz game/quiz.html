<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beautiful Quiz</title>
<style>
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #quiz-container {
    background: #fff;
    border-radius: 15px;
    padding: 40px;
    max-width: 700px;
    width: 90%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    text-align: center;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 2.5em;
    color: #333;
  }

  p {
    font-size: 1.2em;
    margin-bottom: 20px;
    color: #555;
  }

  select {
    padding: 12px 20px;
    font-size: 1em;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
    margin-bottom: 20px;
  }

  button {
    background-color: #4CAF50;
    color: white;
    padding: 14px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.2em;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #45a049;
  }

  #question-box {
    margin-top: 20px;
  }

  .question {
    font-size: 1.4em;
    margin-bottom: 20px;
    font-weight: 600;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .option {
    background: #f0f0f0;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.1em;
    transition: background 0.2s;
  }

  .option:hover {
    background: #ddd;
  }

  .option input {
    margin-right: 15px;
    transform: scale(1.2);
  }

  #next-btn {
    margin-top: 30px;
    display: none;
  }

  #result {
    font-size: 2em;
    margin-top: 30px;
    color: #333;
  }

  #restart-btn {
    margin-top: 20px;
    background-color: #008CBA;
  }

  #restart-btn:hover {
    background-color: #007bb5;
  }
</style>
</head>
<body>

<div id="quiz-container">
  <h1>🌟 Welcome to the Beautiful Quiz! 🌟</h1>
  <div id="start-section">
    <p>Select a subject to start:</p>
    <select id="subject-select">
      <option value="">--Choose a subject--</option>
    </select>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <div id="quiz-section" style="display:none;">
    <div id="question-box">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
    </div>
    <button id="next-btn" onclick="nextQuestion()">Next</button>
  </div>

  <div id="result-section" style="display:none;">
    <div id="result"></div>
    <button id="restart-btn" onclick="restartQuiz()">Try Another Subject</button>
  </div>
</div>

<script>
  const questions = {
    "English": [
      {question: "What is the synonym of 'happy'?", options: ["Sad", "Joyful", "Angry", "Tired"], answer: "Joyful"},
      {question: "What is the antonym of 'cold'?", options: ["Hot", "Warm", "Chilly", "Freezing"], answer: "Hot"},
      {question: "Which word is a noun?", options: ["Run", "Beautiful", "Book", "Quickly"], answer: "Book"},
      {question: "Choose the correct spelling:", options: ["Recieve", "Receive", "Recive", "Receve"], answer: "Receive"},
      {question: "What is the past tense of 'go'?", options: ["Goed", "Went", "Go", "Going"], answer: "Went"}
    ],
    "Math": [
      {question: "What is 5 + 7?", options: ["12", "10", "13", "11"], answer: "12"},
      {question: "What is the square root of 64?", options: ["6", "7", "8", "9"], answer: "8"},
      {question: "What is 15 * 3?", options: ["45", "50", "40", "35"], answer: "45"},
      {question: "What is 100 / 25?", options: ["4", "5", "6", "7"], answer: "4"},
      {question: "What is 9 - 4?", options: ["3", "4", "5", "6"], answer: "5"}
    ],
    "Science": [
      {question: "What planet is known as the Red Planet?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: "Mars"},
      {question: "What is the process by which plants make food?", options: ["Photosynthesis", "Respiration", "Digestion", "Transpiration"], answer: "Photosynthesis"},
      {question: "What gas do humans breathe in?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Helium"], answer: "Oxygen"},
      {question: "What is the largest organ in the human body?", options: ["Heart", "Liver", "Skin", "Lungs"], answer: "Skin"},
      {question: "What is H2O commonly known as?", options: ["Oxygen", "Water", "Hydrogen", "Salt"], answer: "Water"}
    ],
    "History": [
      {question: "Who was the first President of the USA?", options: ["Abraham Lincoln", "George Washington", "Thomas Jefferson", "John Adams"], answer: "George Washington"},
      {question: "In which year did World War II end?", options: ["1945", "1939", "1918", "1960"], answer: "1945"},
      {question: "Who discovered America?", options: ["Christopher Columbus", "Vasco da Gama", "Ferdinand Magellan", "James Cook"], answer: "Christopher Columbus"},
      {question: "Which ancient civilization built pyramids?", options: ["Romans", "Greeks", "Egyptians", "Mayans"], answer: "Egyptians"},
      {question: "Who was known as the Maid of Orleans?", options: ["Cleopatra", "Joan of Arc", "Elizabeth I", "Marie Antoinette"], answer: "Joan of Arc"}
    ],
    "Geography": [
      {question: "What is the capital of France?", options: ["Berlin", "Madrid", "Paris", "Rome"], answer: "Paris"},
      {question: "Which continent is Australia in?", options: ["Asia", "Europe", "Australia", "Africa"], answer: "Australia"},
      {question: "Which is the longest river in the world?", options: ["Amazon", "Nile", "Yangtze", "Mississippi"], answer: "Nile"},
      {question: "Mount Everest is located in which mountain range?", options: ["Alps", "Himalayas", "Andes", "Rockies"], answer: "Himalayas"},
      {question: "Which ocean is the largest?", options: ["Atlantic", "Indian", "Arctic", "Pacific"], answer: "Pacific"}
    ]
  };

  const subjectSelect = document.getElementById('subject-select');
  const startSection = document.getElementById('start-section');
  const quizSection = document.getElementById('quiz-section');
  const questionText = document.getElementById('question-text');
  const optionsContainer = document.getElementById('options-container');
  const nextBtn = document.getElementById('next-btn');
  const resultSection = document.getElementById('result-section');
  const resultDisplay = document.getElementById('result');

  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let selectedSubject = '';

  // Populate subject options dynamically
  window.onload = () => {
    for (const sub in questions) {
      const opt = document.createElement('option');
      opt.value = sub;
      opt.textContent = sub;
      subjectSelect.appendChild(opt);
    }
  };

  function startQuiz() {
    selectedSubject = document.getElementById('subject-select').value;
    if (!selectedSubject) {
      alert('Please select a subject!');
      return;
    }
    currentQuestions = [...questions[selectedSubject]];
    shuffleArray(currentQuestions);
    currentIndex = 0;
    score = 0;
    startSection.style.display = 'none';
    quizSection.style.display = 'block';
    resultSection.style.display = 'none';
    showQuestion();
  }

  function showQuestion() {
    // Clear previous options
    optionsContainer.innerHTML = '';
    // Show current question
    const q = currentQuestions[currentIndex];
    questionText.textContent = q.question;

    // Create options
    q.options.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<input type="radio" name="answer" id="${opt}" value="${opt}">
                       <label for="${opt}">${opt}</label>`;
      div.onclick = () => {
        // Select the radio button
        document.querySelectorAll('input[name="answer"]').forEach(r => r.checked = false);
        div.querySelector('input').checked = true;
        // Show Next button
        nextBtn.style.display = 'inline-block';
      };
      optionsContainer.appendChild(div);
    });

    // Hide Next button until answer selected
    nextBtn.style.display = 'none';
  }

  function nextQuestion() {
    // Check answer
    const selectedRadio = document.querySelector('input[name="answer"]:checked');
    if (selectedRadio) {
      const answer = selectedRadio.value;
      if (answer === currentQuestions[currentIndex].answer) {
        score++;
      }
    }
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    quizSection.style.display = 'none';
    resultSection.style.display = 'block';
    resultDisplay.innerHTML = `🎉 You scored ${score} out of ${currentQuestions.length}! 🎉`;
  }

  function restartQuiz() {
    startSection.style.display = 'block';
    quizSection.style.display = 'none';
    resultSection.style.display = 'none';
    document.getElementById('subject-select').value = '';
  }

  function shuffleArray(array) {
    for (let i = array.length -1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }
</script>

</body>
</html>
