<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IQ Test Gamified Challenge</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #game-container {
    background: #222;
    border-radius: 30px;
    padding: 30px;
    width: 90%;
    max-width: 900px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    position: relative;
    color: #fff;
    text-align: center;
  }

  h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  /* Stars background animation for a game feel */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: transparent;
    background-image: radial-gradient(white 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveStars 50s linear infinite;
    z-index: -1;
  }
  @keyframes moveStars {
    from {background-position: 0 0;}
    to {background-position: 40px 40px;}
  }

  /* Progress bar styling */
  #progress-container {
    margin: 20px 0;
    width: 100%;
    height: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f, #0ff);
    transition: width 0.5s ease;
  }

  /* Question box */
  #question-box {
    margin-top: 20px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  #question {
    font-size: 1.5em;
    margin-bottom: 20px;
  }

  /* Options as game cards */
  .option {
    background: #444;
    margin: 10px 0;
    padding: 15px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 1.2em;
    transition: all 0.3s;
  }

  .option:hover {
    background: #666;
    transform: scale(1.02);
  }

  /* Next button */
  #next-btn {
    margin-top: 20px;
    padding: 15px 30px;
    font-size: 1.2em;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #00f, #0ff);
    color: #fff;
    cursor: pointer;
    display: none;
    transition: background 0.3s;
  }

  #next-btn:hover {
    background: linear-gradient(45deg, #0ff, #00f);
  }

  /* Final score screen */
  #score-screen {
    display: none;
    margin-top: 30px;
    font-size: 2em;
  }

  #restart-btn {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 1.2em;
    border: none;
    border-radius: 10px;
    background: #ff7e5f;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
  }

  #restart-btn:hover {
    background: #ff4e3f;
  }

  /* Confetti animation canvas */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }
</style>
</head>
<body>

<div id="game-container">
  <h1>🚀 Space IQ Challenge! 🚀</h1>
  <!-- Progress bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <!-- Question section -->
  <div id="question-section">
    <div id="question"></div>
    <div id="options"></div>
    <button id="next-btn" onclick="nextQuestion()">Next</button>
  </div>

  <!-- Final score -->
  <div id="score-screen">
    <div id="final-score"></div>
    <button id="restart-btn" onclick="restartGame()">Play Again</button>
  </div>
</div>

<!-- Confetti Canvas -->
<canvas id="confetti-canvas"></canvas>

<script>
  // Example IQ question
  const questions = [
    {
      question: "What number best completes the sequence: 2, 4, 8, 16, ...?",
      options: ["24", "32", "20", "18"],
      answer: "32"
    },
    {
      question: "If all Bloops are Razzies and all Razzies are Lazzies, are all Bloops definitely Lazzies?",
      options: ["Yes", "No", "Cannot be determined", "Only some Bloops are Lazzies"],
      answer: "Yes"
    },
    {
      question: "What is the odd one out?",
      options: ["Apple", "Banana", "Carrot", "Orange"],
      answer: "Carrot"
    },
    {
      question: "What comes next in the pattern: A, C, E, G, ...?",
      options: ["H", "I", "J", "K"],
      answer: "I"
    },
    {
      question: "If you rearrange the letters 'CIFA', you would get the name of:",
      options: ["FICA", "CAFE", "FACE", "ACFE"],
      answer: "CAFE"
    }
  ];

  let currentQuestionIndex = 0;
  let score = 0;

  const questionDiv = document.getElementById('question');
  const optionsDiv = document.getElementById('options');
  const nextBtn = document.getElementById('next-btn');
  const progressBar = document.getElementById('progress-bar');
  const finalScoreDiv = document.getElementById('final-score');
  const scoreScreen = document.getElementById('score-screen');
  const questionSection = document.getElementById('question-section');

  // Canvas for confetti
  const confettiCanvas = document.getElementById('confetti-canvas');
  const ctx = confettiCanvas.getContext('2d');

  window.onload = () => {
    loadQuestion();
    updateProgress();
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
  };

  function loadQuestion() {
    clearOptions();
    const q = questions[currentQuestionIndex];
    questionDiv.textContent = q.question;
    q.options.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<input type="radio" name="answer" id="${opt}" value="${opt}">
                       <label for="${opt}">${opt}</label>`;
      div.onclick = () => {
        document.querySelectorAll('input[name="answer"]').forEach(r => r.checked = false);
        div.querySelector('input').checked = true;
        nextBtn.style.display = 'inline-block';
      };
      optionsDiv.appendChild(div);
    });
    nextBtn.style.display = 'none';
  }

  function clearOptions() {
    optionsDiv.innerHTML = '';
  }

  function nextQuestion() {
    const selected = document.querySelector('input[name="answer"]:checked');
    if (selected) {
      if (selected.value === questions[currentQuestionIndex].answer) {
        score++;
      }
    }
    currentQuestionIndex++;
    updateProgress();
    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      showFinalScore();
    }
  }

  function updateProgress() {
    const percent = (currentQuestionIndex / questions.length) * 100;
    progressBar.style.width = percent + '%';
  }

  function showFinalScore() {
    questionSection.style.display = 'none';
    finalScoreDiv.textContent = `🎉 You scored ${score} out of ${questions.length}! 🎉`;
    scoreScreen.style.display = 'block';
    launchConfetti();
  }

  function restartGame() {
    currentQuestionIndex = 0;
    score = 0;
    questionSection.style.display = 'block';
    scoreScreen.style.display = 'none';
    loadQuestion();
    updateProgress();
  }

  // Confetti animation
  function resizeCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }

  function launchConfetti() {
    resizeCanvas();
    const particles = [];
    for (let i=0; i<200; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * -100,
        r: Math.random() * 4 + 1,
        d: Math.random() * 4 + 1,
        color: `hsl(${Math.random() * 360}, 100%, 60%)`,
        tilt: Math.random() * 10 - 5,
        tiltAngle: Math.random() * Math.PI * 2
      });
    }

    function animate() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach(p => {
        p.tiltAngle += 0.02;
        p.x += Math.sin(p.tiltAngle) * 2;
        p.y += p.d;
        if (p.y > window.innerHeight + 10) {
          p.y = -10;
          p.x = Math.random() * window.innerWidth;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }

    animate();
  }
</script>
</body>
</html>
