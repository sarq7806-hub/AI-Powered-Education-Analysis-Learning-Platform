<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Performance Analysis Dashboard</title>
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1 class="logo">🎨 Data Performance Dashboard</h1>
</header>

<section class="intro">
  <h2>Welcome! View Your Data & Performance Analysis</h2>
  <p>Enter your data below or see the example data to analyze your performance visually.</p>
  <button class="btn" onclick="loadExampleData()">Load Example Data</button>
</section>

<section class="data-input">
  <h3>Input Your Data</h3>
  <div class="input-group">
    <label>Scores in Different Skills:</label>
    <input type="number" id="skill1" placeholder="Skill 1 (e.g., Python)" min="0" max="100" value="70"/>
    <input type="number" id="skill2" placeholder="Skill 2 (e.g., SQL)" min="0" max="100" value="80"/>
    <input type="number" id="skill3" placeholder="Skill 3 (e.g., ML)" min="0" max="100" value="60"/>
    <input type="number" id="skill4" placeholder="Skill 4 (e.g., Cloud)" min="0" max="100" value="50"/>
  </div>
  <button class="btn btn-primary" onclick="generateCharts()">Analyze Performance</button>
</section>

<section class="charts-section">
  <div class="chart-container">
    <h3>Performance Breakdown</h3>
    <canvas id="doughnutChart"></canvas>
  </div>
  <div class="chart-container">
    <h3>Skill Comparison</h3>
    <canvas id="barChart"></canvas>
  </div>
</section>

<section class="results">
  <h3>Performance Summary</h3>
  <p id="summary"></p>
</section>

<footer>
  <p>&copy; 2024 Data Performance Dashboard | All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
