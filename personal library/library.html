<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📚 Library Management System</h1>

    <div class="form-box">

        <input
            type="text"
            id="title"
            placeholder="Book Title"
        >

        <input
            type="text"
            id="author"
            placeholder="Author"
        >

        <input
            type="number"
            id="year"
            placeholder="Year"
        >

        <div class="buttons">

            <button class="add" onclick="addBook()">
                Add Book
            </button>

            <button class="update" onclick="updateBook()">
                Update Book
            </button>

            <button class="delete" onclick="deleteBook()">
                Delete Book
            </button>

            <button class="clear" onclick="clearFields()">
                Clear
            </button>

        </div>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Year</th>
                </tr>

            </thead>

            <tbody id="bookTable">

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
